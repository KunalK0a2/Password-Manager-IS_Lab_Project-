<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SecureLock Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary-color: #1e4533;
      --primary-hover: #1ed760;
      --card-bg: #181818;
      --input-bg: #333333;
      --body-bg: #0b0b0b;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--body-bg);
      min-height: 100vh;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.5s ease-out forwards;
    }

    #matrix-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      pointer-events: none;
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: 0 16px;
    }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .dark-card {
      background-color: var(--card-bg);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      animation: popIn 0.4s ease-out both;
    }

    .form-input {
      background-color: var(--input-bg);
      color: #ffffff;
      border: 1px solid #4d4d4d;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      transition: all 0.2s ease-in-out;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px var(--primary-color);
      transform: scale(1.02);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: black;
      font-weight: bold;
      padding: 0.75rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-primary:active { transform: scale(0.95); filter: brightness(0.9); }

    .toggle-link {
      color: var(--primary-color);
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .toggle-link:hover { color: var(--primary-hover); }

    .hidden { display: none; }

    @keyframes smooth-unlock {
      0% { transform: rotate(0deg) translateY(0); }
      30% { transform: rotate(-10deg) translateY(-2px); }
      60% { transform: rotate(-25deg) translateY(-4px); }
      80% { transform: rotate(-20deg) translateY(-3px); }
      100% { transform: rotate(-25deg) translateY(-4px); }
    }

    .padlock-shackle {
      transform-origin: 80% 90%;
      animation: smooth-unlock 1s ease-in-out forwards;
      animation-delay: 0.2s;
    }

    @media (max-width: 420px) {
      .dark-card { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>

  <div class="app-wrapper">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-white flex items-center justify-center">
        <i class="fas fa-lock text-[#1ed760] mr-3"></i> SecureLock
      </h1>
    </header>

    <div id="login-view" class="dark-card p-8 rounded-xl">
      <h2 class="text-2xl font-semibold mb-6 text-center">Welcome Back</h2>
      <form id="login-form">
        <input id="login-username" type="text" placeholder="Username" required class="form-input w-full mb-4" autocomplete="username" />
        <input id="login-password" type="password" placeholder="Master Password" required class="form-input w-full mb-4" autocomplete="current-password" />
        <button type="submit" class="btn-primary w-full">Unlock Vault</button>
      </form>
      <p class="text-center text-sm text-gray-400 mt-6">Don't have an account? <span id="show-signup" class="toggle-link font-semibold">Sign Up</span></p>
    </div>

    <div id="signup-view" class="hidden dark-card p-8 rounded-xl">
      <h2 class="text-2xl font-semibold mb-6 text-center">Create Your Account</h2>
      <form id="signup-form">
        <input id="signup-username" type="text" placeholder="Choose a Username" required class="form-input w-full mb-4" autocomplete="username" />
        <input id="signup-password" type="password" placeholder="Choose a Master Password" required class="form-input w-full mb-4" autocomplete="new-password" />
        <button type="submit" class="btn-primary w-full">Create Account & Login</button>
      </form>
      <p class="text-center text-sm text-gray-400 mt-6">Already have an account? <span id="show-login" class="toggle-link font-semibold">Log In</span></p>
    </div>

    <div id="success-view" class="hidden dark-card p-8 rounded-xl text-center">
      <div class="unlock-animation">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 mx-auto" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path class="padlock-shackle" d="M7 11V7a5 5 0 0 1 10 0v4" stroke="var(--primary-color)"></path>
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" fill="var(--input-bg)" stroke="#4d4d4d"></rect>
          <circle cx="12" cy="16.5" r="1.5" fill="#1db954"></circle>
        </svg>
      </div>
      <p class="text-lg font-semibold text-gray-300 mt-4">Unlocked!</p>
    </div>

    <p id="error-message" class="text-red-400 text-center mt-4 font-semibold hidden"></p>
  </div>

  <script>
    const loginView = document.getElementById('login-view');
    const signupView = document.getElementById('signup-view');
    const successView = document.getElementById('success-view');
    const errorMessage = document.getElementById('error-message');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const showSignupBtn = document.getElementById('show-signup');
    const showLoginBtn = document.getElementById('show-login');

    function showError(message) {
      errorMessage.textContent = message;
      if (message) errorMessage.classList.remove('hidden');
      else errorMessage.classList.add('hidden');
    }

    function handleSuccess() {
      loginView.classList.add('hidden');
      signupView.classList.add('hidden');
      errorMessage.classList.add('hidden');
      successView.classList.remove('hidden');

      setTimeout(() => {
        window.location.href = '/vault';
      }, 1800);
    }

    showSignupBtn.addEventListener('click', () => {
      loginView.classList.add('hidden');
      signupView.classList.remove('hidden');
      showError('');
    });

    showLoginBtn.addEventListener('click', () => {
      signupView.classList.add('hidden');
      loginView.classList.remove('hidden');
      showError('');
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');
      const username = document.getElementById('signup-username').value;
      const master_password = document.getElementById('signup-password').value;

      try {
        const response = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, master_password }),
        });

        if (response.ok) {
          handleSuccess();
        } else {
          const error = await response.json();
          showError(error.error || 'An error occurred.');
        }
      } catch (err) {
        showError('Could not connect to the server.');
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');
      const username = document.getElementById('login-username').value;
      const master_password = document.getElementById('login-password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, master_password }),
        });

        if (response.ok) {
          handleSuccess();
        } else {
          const error = await response.json();
          showError(error.error || 'Invalid credentials.');
        }
      } catch (err) {
        showError('Could not connect to the server.');
      }
    });

    (function initMatrix() {
      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      const chars = '01'.split('');

      let width = 0;
      let height = 0;
      let fontSize = 16;
      let columns = [];
      let animationId = null;
      let running = true;

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        fontSize = Math.max(12, Math.floor(Math.min(20, width / 60)));
        ctx.font = fontSize + 'px monospace';
        columns = new Array(Math.floor(width / fontSize)).fill(0).map(() => Math.floor(Math.random() * height / fontSize));
      }

      function draw() {
        if (!running) return;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < columns.length; i++) {
          const x = i * fontSize;
          const y = columns[i] * fontSize;

          ctx.fillStyle = 'rgba(180, 255, 180, 0.45)';
          ctx.fillText(chars[Math.floor(Math.random() * chars.length)], x, y);

          ctx.fillStyle = 'rgba(0, 200, 80, 0.35)';
          ctx.fillText(chars[Math.floor(Math.random() * chars.length)], x, y - fontSize * 0.6);

          columns[i] = (columns[i] + 0.3 + Math.random() * 0.4) % (Math.floor(height / fontSize) + 10);
        }

        animationId = requestAnimationFrame(draw);
      }

      function stop() {
        running = false;
        if (animationId) cancelAnimationFrame(animationId);
        animationId = null;
      }

      function start() {
        if (!running) {
          running = true;
          draw();
        }
      }

      resize();
      draw();

      window.addEventListener('resize', () => {
        if (animationId) cancelAnimationFrame(animationId);
        resize();
        if (running) draw();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stop();
        else start();
      });
    })();
  </script>
</body>
</html>
